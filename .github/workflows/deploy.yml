# Сборка и раздача: сайт на GitHub Pages (ссылка для iPad и Android) и APK для Android.
# Голоса Piper скачиваются здесь, при сборке; в приложении сеть не нужна.
# APK попадает в релиз, только если прошёл проверку на эмуляторе Android.
name: Сборка и публикация

on:
  push:
    branches: [claude/gracious-curie-l3ilc4, main]
  workflow_dispatch:

permissions:
  contents: write # релиз с APK
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run voices
      - run: npm run check

      - name: Сайт для GitHub Pages
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Сайт для APK
        run: |
          npm run build
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/web
          cp -r out android/app/src/main/assets/web
        env:
          NEXT_PUBLIC_BASE_PATH: /app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Постоянный ключ подписи, если он задан в секретах
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: APK (для раздачи и отладочный для проверки)
        run: |
          gradle -p android assembleRelease assembleDebug --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk golos-vnutri.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk golos-vnutri-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: golos-vnutri-apk
          path: golos-vnutri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: golos-vnutri-debug-apk
          path: golos-vnutri-debug.apk
          retention-days: 3

  android-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: golos-vnutri-debug-apk

      - name: Ускорение эмулятора (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверка на эмуляторе Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: adb install -r golos-vnutri-debug.apk && node --experimental-strip-types scripts/android-smoke.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke.png
          if-no-files-found: ignore

  release:
    needs: android-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: golos-vnutri-apk

      - name: Релиз с APK (постоянная ссылка на скачивание)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --cleanup-tag --yes || true
          gh release create apk golos-vnutri.apk \
            --target "${{ github.sha }}" \
            --title "Голос внутри для Android, сборка ${{ github.run_number }}" \
            --notes "Скачайте golos-vnutri.apk на планшет с Android и откройте его. Новая сборка ставится поверх старой, данные сохраняются." \
            --latest

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
